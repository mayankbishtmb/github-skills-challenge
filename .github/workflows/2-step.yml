name: Step 2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/python-package.yml
      - .github/workflows/python-coverage.yml

permissions:
  contents: read
  actions: write
  issues: write

env:
  STEP_3_FILE: ".github/steps/3-step.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    runs-on: ubuntu-latest
    outputs:
      issue-number: ${{ steps.find-exercise.outputs.issue-number }}
    steps:
      - name: Find exercise by issue title
        id: find-exercise
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE_PREFIX: Exercise
        with:
          script: |
            const response = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 50
            });

            const issues = response.data.filter(item => !item.pull_request);
            core.startGroup(`Found ${issues.length} issues in total`);
            issues.forEach(issue => {
              core.info(`#${issue.number}: ${issue.html_url}`);
            });
            core.endGroup();

            const issue = issues.find(issue => issue.title.includes(process.env.ISSUE_TITLE_PREFIX));
            if (!issue) {
              core.warning('No exercise issue found. Continuing without issue comments.');
              core.setOutput('issue-number', '');
              return;
            }

            core.info(`Exercise issue found: #${issue.number} (${issue.html_url})`);
            core.setOutput('issue-number', String(issue.number));

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.7.0

      - name: Find last comment
        if: env.ISSUE_NUMBER != ''
        id: find-last-comment
        uses: peter-evans/find-comment@v3
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Update comment - checking work
        if: env.ISSUE_NUMBER != ''
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Check for python package workflow
        id: check-python-package-workflow
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v1
        with:
          text-file: .github/workflows/python-package.yml
          keyphrase: pytest
          minimum-occurrences: 1
          case-sensitive: false

      - name: Check for python coverage workflow
        id: check-python-coverage-workflow
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v1
        with:
          text-file: .github/workflows/python-coverage.yml
          keyphrase: pytest --cov=src
          minimum-occurrences: 1
          case-sensitive: false

      - name: Update comment - step results
        if: env.ISSUE_NUMBER != ''
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 2
            results_table:
              - description: "Python package workflow created"
                passed: ${{ steps.check-python-package-workflow.outcome == 'success' }}
              - description: "Python coverage workflow created"
                passed: ${{ steps.check-python-coverage-workflow.outcome == 'success' }}

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Post next step content
    if: needs.find_exercise.outputs.issue-number != ''
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.7.0

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 3

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_3_FILE }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{github.workflow}}"
          gh workflow enable "Step 3"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
